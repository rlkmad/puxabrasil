<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puxa Brasil · Jogo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1c6fd1; color: #fff; font: 700 28px/1.3 system-ui, sans-serif; }
  body { display: grid; place-items: center; text-align: center; }
  #msg { text-shadow: 0 2px 0 #0B1B3A, 0 0 6px #0B1B3A; padding: 24px; }
  small { display: block; font-weight: 400; font-size: 18px; margin-top: 8px; }
</style>
</head>
<body>
<div id="msg">Aguardando a live começar…<small id="ws">conectando ao servidor…</small></div>
<script>
(function () {
  var el = document.getElementById('ws');
  function conectar() {
    var s = new WebSocket('ws://' + location.host + '/ws');
    s.onopen = function () { el.textContent = 'servidor conectado (Fase 0: tela vazia)'; };
    s.onclose = function () { el.textContent = 'reconectando…'; setTimeout(conectar, 2000); };
    s.onerror = function () { s.close(); };
  }
  conectar();
})();
</script>
</body>
</html>
